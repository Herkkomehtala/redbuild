apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
bases:
  - ../../base

resources:
  - ingress.yaml
  - cluster-issuer.yaml

images:
  - name: redbuild-backend
    newName: your-registry/redbuild-backend
    newTag: v1.0.0
  - name: redbuild-frontend
    newName: your-registry/redbuild-frontend
    newTag: v1.0.0
  - name: win-c-compiler-worker
    newName: your-registry/win-c-compiler-worker
    newTag: v1.0.0
