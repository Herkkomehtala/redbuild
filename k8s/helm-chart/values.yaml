frontend:
  image: "redbuild-frontend:latest"

backend:
  image: "redbuild-backend:latest"
  workerImage: "win-c-compiler-worker:latest"

replicaCount: 1

service:
  frontend:
    type: ClusterIP
    port: 80
  backend:
    type: ClusterIP
    port: 5000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: redbuild.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:


rbac:
  create: true
  serviceAccountName: job-manager-sa

pvc:
  create: true
  storageClassName: ""
  size: "2Gi"
  accessModes:
    - ReadWriteOnce

monitoring:
  otlpEndpoint: ""
