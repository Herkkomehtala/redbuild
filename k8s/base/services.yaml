apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
spec:
  selector:
    app: redbuild-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: redbuild-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

