apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: job-manager-sa
      containers:
      - name: api
        image: redbuild-backend
        command: ["python", "run.py"]
        ports:
        - containerPort: 5000
        env:
        - name: REDBUILD_BACKEND_IMAGE
          value: "{{.REDBUILD_BACKEND_IMAGE}}"
        - name: WIN_C_COMPILER_WORKER_IMAGE
          value: "{{.WIN_C_COMPILER_WORKER_IMAGE}}"
        volumeMounts:
        - name: uploads-storage
          mountPath: /tmp/uploads
      volumes:
      - name: uploads-storage
        persistentVolumeClaim:
          claimName: shared-uploads-pvc

