<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redbuild Payload Generator</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #121416;
            --bg-card: #1d2125;
            --bg-input: #2c3238;
            --border-color: #383f45;
            --text-main: #f8f9fa;
            --text-secondary: #ced4da; /* Significantly better contrast than adb5bd */
            --text-muted: #adb5bd;
            --accent-blue: #0d6efd;
        }

        body { 
            background-color: var(--bg-deep); 
            color: var(--text-main);
            letter-spacing: -0.01em;
        }

        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .form-label { 
            color: var(--text-main); 
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-control, .form-select { 
            background-color: var(--bg-input); 
            color: var(--text-main); 
            border-color: var(--border-color); 
            padding: 0.6rem 0.75rem;
        }

        .form-select {
            /* Base64 encoded white chevron */
            background-image: url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHBhdGggZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZjhmOWZhIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZS13aWR0aD0iMiIgZD0ibTIgNSA2IDYgNi02Ii8+PC9zdmc+");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
        }

        .form-control:focus, .form-select:focus { 
            background-color: var(--bg-input); 
            color: #fff; 
            border-color: var(--accent-blue); 
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15); 
        }

        .form-control::placeholder { color: var(--text-muted); opacity: 0.6; }

        /* File Input Specific Polish */
        .form-control[type="file"] {
            padding: 0.375rem 0.75rem; /* Reset to standard height to avoid button overlap */
            line-height: 1.5;
        }
        
        .form-control[type="file"]::file-selector-button {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            border-radius: 4px;
            padding: 0.2rem 0.75rem;
            margin-right: 0.75rem;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .form-control[type="file"]::file-selector-button:hover {
            background-color: #495057;
        }

        .btn-outline-secondary {
            border-color: var(--border-color);
            color: var(--text-secondary);
        }
        .btn-outline-secondary:hover {
            background-color: var(--bg-input);
            border-color: var(--text-muted);
            color: #fff;
        }

        .progress { background-color: var(--bg-input); }
        .hidden-option { display: none !important; }

        .btn-group-radio label { 
            border-color: var(--border-color); 
            background-color: var(--bg-input); 
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .btn-group-radio input[type="radio"]:checked + label { 
            background-color: var(--accent-blue); 
            border-color: var(--accent-blue); 
            color: #fff;
        }

        .h3 { color: #ffffff; letter-spacing: -0.02em; }
        .text-muted { color: var(--text-muted) !important; }
        
        .version-info-inset-group {
            padding: 1.25rem;
            background-color: rgba(0,0,0,0.2);
            border-radius: 8px;
            margin-top: 1rem;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem 1.25rem;
            border: 1px dashed var(--border-color);
        }
        .version-info-inset-group > div { margin-bottom: 0 !important; }
        .version-info-inset-group .form-label { font-size: 0.8rem; color: var(--text-secondary); }
        .version-info-group legend, .guardrail-group legend { 
            color: var(--accent-blue); 
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            width: auto; 
            margin-bottom: 0.5rem; 
            padding: 0 0.5rem;
        }
        
        .profile-card {
            cursor: pointer;
            border: 1px solid var(--border-color);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: var(--bg-input);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 80px;
        }
        .profile-card:hover { 
            border-color: var(--text-muted); 
            background-color: #353c43;
            transform: translateY(-1px);
        }
        .profile-card.active {
            border-color: var(--accent-blue);
            background-color: rgba(13, 110, 253, 0.1);
            box-shadow: 0 0 0 1px var(--accent-blue);
        }
        .profile-card.active .fw-bold { color: var(--accent-blue); }
        .profile-card .fw-bold { color: var(--text-main); margin-bottom: 4px; font-size: 0.85rem; }
        .profile-card .description { 
            color: var(--text-secondary); 
            font-size: 0.78rem; 
            line-height: 1.3;
        }
        .form-check-label { 
            color: var(--text-main); 
            font-size: 0.9rem;
            cursor: pointer;
            padding-left: 0.25rem;
        }

        /* Specifically ensure advanced options text is clear */
        #advanced-options-collapse .card {
            background-color: rgba(0,0,0,0.15);
            border-style: dashed;
        }
        
        #advanced-options-collapse .form-label,
        #advanced-options-collapse .form-check-label {
            color: var(--text-secondary);
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 bg-dark">

<main class="container" style="max-width: 800px;">
    <div class="card p-4 p-md-5 shadow rounded-3">
        <div class="text-center mb-4">
            <h1 class="h3 mb-1 fw-bold">Redbuild Payload Generator</h1>
            <p class="text-muted">Dynamic infrastructure for payload generation</p>
        </div>

        <form id="upload-form">
            <div class="mb-4">
                <label for="generator-type-select" class="form-label fw-bold">1. Select Generator Type</label>
                <select class="form-select form-select-lg" id="generator-type-select" name="generator_type" required>
                    <option selected disabled value="">Loading...</option>
                </select>
            </div>

            <div id="options-container"></div>

            <button class="w-100 btn btn-lg btn-primary mt-4 py-3 fw-bold" type="submit">Build Payload</button>
        </form>

        <div id="status-container" class="mt-4"></div>
    </div>
</main>
<script src="js/bootstrap.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const uploadForm = document.getElementById('upload-form');
    const generatorTypeSelect = document.getElementById('generator-type-select');
    const optionsContainer = document.getElementById('options-container');
    const statusContainer = document.getElementById('status-container');
    
    let generatorsData = {};
    let pollingInterval;
    let isApplyingProfile = false;

    async function fetchAndBuildUI() {
        try {
            const response = await fetch('/api/options');
            if (!response.ok) throw new Error(`Failed to fetch options (${response.status})`);
            
            generatorsData = await response.json();
            generatorTypeSelect.innerHTML = '<option selected disabled value="">Choose a generator type...</option>';

            for (const type in generatorsData) {
                const opt = document.createElement('option');
                opt.value = type;
                opt.textContent = generatorsData[type].display_name || (type.charAt(0).toUpperCase() + type.slice(1));
                generatorTypeSelect.appendChild(opt);
            }
        } catch (error) {
            generatorTypeSelect.innerHTML = `<option selected disabled>Error: ${error.message}</option>`;
        }
    }

    function onGeneratorTypeChange() {
        const selectedType = generatorTypeSelect.value;
        optionsContainer.innerHTML = '';
        if (!selectedType || !generatorsData[selectedType]) return;

        const generator = generatorsData[selectedType];
        
        const basicContainer = document.createElement('div');
        basicContainer.id = 'basic-options-container';
        
        let profileContainer = null;
        if (generator.profiles && generator.profiles.length > 0) {
            profileContainer = document.createElement('div');
            profileContainer.id = 'profiles-container';
            profileContainer.className = 'mb-4';
            
            profileContainer.innerHTML = `<label class="form-label d-block mb-2 fw-bold">2. Choose Configuration Profile</label><div class="row g-2" id="profile-cards"></div>`;
            const row = profileContainer.querySelector('#profile-cards');
            
            generator.profiles.forEach((profile, index) => {
                const col = document.createElement('div');
                col.className = 'col-6 col-md-3';
                col.innerHTML = `
                    <div class="card p-2 h-100 profile-card ${index === 0 ? 'active' : ''}" data-profile="${profile.name}">
                        <div class="fw-bold">${profile.name}</div>
                        <div class="description">${profile.description}</div>
                    </div>
                `;
                col.querySelector('.profile-card').addEventListener('click', () => applyProfile(profile.name));
                row.appendChild(col);
            });
            
            const customCol = document.createElement('div');
            customCol.className = 'col-6 col-md-3';
            customCol.innerHTML = `
                <div class="card p-2 h-100 profile-card" data-profile="Custom">
                    <div class="fw-bold">Custom</div>
                    <div class="description">Manual configuration of all available settings.</div>
                </div>
            `;
            customCol.querySelector('.profile-card').addEventListener('click', () => setProfileActive('Custom'));
            row.appendChild(customCol);
        }

        const optionsTitle = document.createElement('label');
        optionsTitle.className = 'form-label d-block mb-2 fw-bold';
        optionsTitle.textContent = '3. Configure Details';
        basicContainer.appendChild(optionsTitle);

        const advancedToggle = document.createElement('button');
        advancedToggle.className = 'btn btn-sm btn-outline-secondary w-100 mb-3';
        advancedToggle.type = 'button';
        advancedToggle.setAttribute('data-bs-toggle', 'collapse');
        advancedToggle.setAttribute('data-bs-target', '#advanced-options-collapse');
        advancedToggle.innerHTML = '⚙️ Show Advanced Options';
        
        const advancedCollapse = document.createElement('div');
        advancedCollapse.className = 'collapse mb-3';
        advancedCollapse.id = 'advanced-options-collapse';
        const advancedCard = document.createElement('div');
        advancedCard.className = 'card card-body';
        advancedCollapse.appendChild(advancedCard);

        advancedCollapse.addEventListener('show.bs.collapse', () => advancedToggle.innerHTML = '⚙️ Hide Advanced Options');
        advancedCollapse.addEventListener('hide.bs.collapse', () => advancedToggle.innerHTML = '⚙️ Show Advanced Options');

        let versionInfoGroup = null;
        let versionInfoInsetGroup = null; 
        if (generator.options.some(opt => opt.name.startsWith('version_info_'))) {
            versionInfoGroup = document.createElement('fieldset');
            versionInfoGroup.className = 'version-info-group';
            versionInfoGroup.innerHTML = '<legend>Version Information</legend>';

            versionInfoInsetGroup = document.createElement('div');
            versionInfoInsetGroup.className = 'version-info-inset-group';
        }

        let guardrailGroup = null;
        if (generator.options.some(opt => opt.name.startsWith('guardrail_'))) {
            guardrailGroup = document.createElement('fieldset');
            guardrailGroup.className = 'guardrail-group mb-3';
            guardrailGroup.innerHTML = '<legend>Guardrails</legend>';
        }

        if (!generator.options.find(opt => opt.name === 'data_source')) {
             const fileInputContainer = document.createElement('div');
             fileInputContainer.id = 'file-input-container';
             fileInputContainer.className = 'mb-3';
             fileInputContainer.innerHTML = `
                 <label for="file-input" class="form-label">Input File</label>
                 <input class="form-control" type="file" id="file-input" name="file" required>
             `;
             basicContainer.appendChild(fileInputContainer);
        }
        
        generator.options.forEach(option => {
            const containerDiv = document.createElement('div');
            const isVersionInfoField = option.name.startsWith('version_info_') && option.name !== 'version_info_template_select';
            const isVersionInfoTemplate = option.name === 'version_info_template_select';
            const isGuardrailField = option.name.startsWith('guardrail_');
            const isAdvanced = option.advanced === true;

            containerDiv.className = 'mb-3'; 
            containerDiv.id = `container-${option.name}`;
            
            if (option.type === 'select' && option.name === 'output_format') {
                renderRadioGroup(option, containerDiv, isAdvanced);
            } else if (option.type === 'select') {
                renderSelect(option, containerDiv, isAdvanced);
            } else if (option.type === 'text' || option.type === 'number') {
                renderTextInput(option, containerDiv, isAdvanced);
            } else if (option.type === 'checkbox') {
                renderCheckbox(option, containerDiv, isAdvanced);
            } else if (option.type === 'multiselect') {
                renderMultiSelect(option, containerDiv, isAdvanced);
            }
            
            let targetContainer = isAdvanced ? advancedCard : basicContainer;

            if (isVersionInfoTemplate && versionInfoGroup) {
                versionInfoGroup.appendChild(containerDiv);
            } else if (isVersionInfoField && versionInfoInsetGroup) {
                versionInfoInsetGroup.appendChild(containerDiv);
            } else if (isGuardrailField && guardrailGroup) {
                guardrailGroup.appendChild(containerDiv);
            } else {
                targetContainer.appendChild(containerDiv);
            }

            if (option.name === 'data_source') {
                const fileInputContainer = document.createElement('div');
                fileInputContainer.id = 'file-input-container';
                fileInputContainer.className = 'mb-3 hidden-option';
                fileInputContainer.innerHTML = `
                    <label for="file-input" class="form-label">Input File (for embedding)</label>
                    <input class="form-control" type="file" id="file-input" name="file">
                `;
                containerDiv.insertAdjacentElement('afterend', fileInputContainer);
            }
        });

        if (versionInfoInsetGroup) {
            versionInfoGroup.appendChild(versionInfoInsetGroup);
        }
        if (guardrailGroup) {
            advancedCard.appendChild(guardrailGroup);
        }
        if (versionInfoGroup) {
            advancedCard.appendChild(versionInfoGroup);
        }

        if (profileContainer) {
            optionsContainer.appendChild(profileContainer);
        }
        optionsContainer.appendChild(basicContainer);
        
        if (advancedCard.children.length > 0) {
            optionsContainer.appendChild(advancedToggle);
            optionsContainer.appendChild(advancedCollapse);
        }

        if (generator.profiles && generator.profiles.length > 0) {
            applyProfile(generator.profiles[0].name);
        } else {
            updateDependencies();
        }
    }

    function setProfileActive(profileName) {
        document.querySelectorAll('.profile-card').forEach(card => {
            if (card.getAttribute('data-profile') === profileName) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }
        });
    }

    function applyProfile(profileName) {
        if (profileName === 'Custom') {
            setProfileActive('Custom');
            return;
        }

        const generator = generatorsData[generatorTypeSelect.value];
        if (!generator || !generator.profiles) return;
        
        const profile = generator.profiles.find(p => p.name === profileName);
        if (!profile) return;

        isApplyingProfile = true;
        setProfileActive(profileName);

        for (const [key, value] of Object.entries(profile.settings)) {
            const element = document.getElementById(`option-${key}`);
            
            if (element) {
                if (element.type === 'checkbox') {
                    element.checked = (value === 'true' || value === true);
                } else {
                    element.value = value;
                }
            } else {
                const radio = document.querySelector(`input[name="${key}"][value="${value}"]`);
                if (radio) {
                    radio.checked = true;
                }
            }
        }
        
        updateDependencies();
        isApplyingProfile = false;
    }

    function checkProfileDrift() {
        if (isApplyingProfile) return;
        
        const generator = generatorsData[generatorTypeSelect.value];
        if (!generator || !generator.profiles) return;

        let matchedProfile = null;
        for (const profile of generator.profiles) {
            let isMatch = true;
            for (const [key, expectedValue] of Object.entries(profile.settings)) {
                const element = document.getElementById(`option-${key}`);
                let currentValue;
                
                if (element) {
                    if (element.type === 'checkbox') {
                        currentValue = element.checked ? 'true' : 'false';
                    } else {
                        currentValue = element.value;
                    }
                } else {
                    const radio = document.querySelector(`input[name="${key}"]:checked`);
                    currentValue = radio ? radio.value : null;
                }

                if (String(currentValue) !== String(expectedValue)) {
                    isMatch = false;
                    break;
                }
            }
            if (isMatch) {
                matchedProfile = profile.name;
                break;
            }
        }

        setProfileActive(matchedProfile || 'Custom');
    }

    function updateDependencies() {
        const selectedType = generatorTypeSelect.value;
        if (!selectedType || !generatorsData[selectedType]) return;
        const generator = generatorsData[selectedType];

        const outputFormatEl = document.querySelector('[name="output_format"]:checked');
        const templateSelectEl = document.getElementById('option-version_info_template_select');
        
        if (outputFormatEl && templateSelectEl && generator.version_info_templates) {
            const currentFormat = outputFormatEl.value;
            const templates = generator.version_info_templates[currentFormat] || [];
            
            const currentValue = templateSelectEl.value;
            
            templateSelectEl.innerHTML = '<option value="">-- Load a Preset --</option>';
            templates.forEach(template => {
                const opt = document.createElement('option');
                opt.value = template.name;
                opt.textContent = template.name;
                templateSelectEl.appendChild(opt);
            });
            
            templateSelectEl.value = currentValue;
        }

        const dataSourceSelect = document.getElementById('option-data_source');
        const fileInputContainer = document.getElementById('file-input-container');
        if (dataSourceSelect && fileInputContainer) {
            const showFileInput = dataSourceSelect.value === 'embedded';
            if (showFileInput) {
                fileInputContainer.classList.remove('hidden-option');
            } else {
                fileInputContainer.classList.add('hidden-option');
            }
            const fileInput = fileInputContainer.querySelector('#file-input');
            if (fileInput) {
                fileInput.required = showFileInput;
            }
        }

        generator.options.forEach(option => {
            if (option.depends_on) {
                const parentElement = document.querySelector(`[name="${option.depends_on.option}"]:checked`) || document.getElementById(`option-${option.depends_on.option}`);
                const childContainer = document.getElementById(`container-${option.name}`);
                if (parentElement && childContainer) {
                    let isVisible = false;
                    const requiredValue = option.depends_on.value;
                    if (Array.isArray(requiredValue)) {
                        isVisible = requiredValue.includes(parentElement.value);
                    } else {
                        isVisible = parentElement.value === requiredValue;
                    }
                    if (isVisible) {
                        childContainer.classList.remove('hidden-option');
                    } else {
                        childContainer.classList.add('hidden-option');
                    }
                }
            }
        });
    }

    function onTemplateSelect(event) {
        const selectedTemplateName = event.target.value;
        if (!selectedTemplateName) return; 

        const generator = generatorsData[generatorTypeSelect.value];
        const outputFormat = document.querySelector('[name="output_format"]:checked').value;
        const templates = generator.version_info_templates[outputFormat] || [];
        
        const templateData = templates.find(t => t.name === selectedTemplateName);
        if (!templateData) return;

        isApplyingProfile = true;
        for (const key in templateData) {
            if (key === 'name') continue;
            const inputId = `option-version_info_${key}`;
            const inputEl = document.getElementById(inputId);
            if (inputEl) {
                inputEl.value = templateData[key];
            }
        }
        isApplyingProfile = false;
        checkProfileDrift();
    }

    function renderRadioGroup(option, containerDiv, isAdvanced) {
        const driverDiv = document.createElement('div');
        driverDiv.className = 'mb-3';
        driverDiv.innerHTML = `<label class="form-label">${option.display_name}</label>`;
        
        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group w-100 btn-group-radio';
        btnGroup.setAttribute('role', 'group');

        option.choices.forEach(choice => {
            const radioId = `radio-${option.name}-${choice.value}`;
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.className = 'btn-check';
            radio.name = option.name;
            radio.id = radioId;
            radio.value = choice.value;
            radio.autocomplete = 'off';
            if (choice.value === option.default) {
                radio.checked = true;
            }
            radio.addEventListener('change', () => {
                updateDependencies();
                checkProfileDrift();
            });

            const label = document.createElement('label');
            label.className = 'btn btn-outline-primary w-100';
            label.setAttribute('for', radioId);
            label.textContent = choice.text;

            btnGroup.appendChild(radio);
            btnGroup.appendChild(label);
        });
        driverDiv.appendChild(btnGroup);
        containerDiv.appendChild(driverDiv);
    }

    function renderSelect(option, containerDiv, isAdvanced) {
        containerDiv.innerHTML = `<label for="option-${option.name}" class="form-label">${option.display_name}</label>`;
        const select = document.createElement('select');
        select.className = 'form-select';
        select.id = `option-${option.name}`;
        select.name = option.name;

        if (option.name === 'version_info_template_select') {
            select.innerHTML = '<option value="">-- Load a Preset --</option>';
            select.addEventListener('change', onTemplateSelect);
        } else {
             option.choices.forEach(choice => {
                const opt = document.createElement('option');
                opt.value = choice.value;
                opt.textContent = choice.text;
                select.appendChild(opt);
            });
        }
        
        select.value = option.default || '';
        select.addEventListener('change', () => {
            updateDependencies();
            checkProfileDrift();
        });
        containerDiv.appendChild(select);
    }

    function renderTextInput(option, containerDiv, isAdvanced) {
        const label = document.createElement('label');
        label.htmlFor = `option-${option.name}`;
        label.className = 'form-label';
        label.textContent = option.display_name;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control';
        input.id = `option-${option.name}`;
        input.name = option.name;
        input.placeholder = option.placeholder || '';
        input.value = option.default || '';
        
        input.addEventListener('input', () => {
            checkProfileDrift();
        });

        containerDiv.appendChild(label);
        containerDiv.appendChild(input);
    }

    function renderCheckbox(option, containerDiv, isAdvanced) {
        containerDiv.className = 'mb-3 form-check form-switch';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'form-check-input';
        input.id = `option-${option.name}`;
        input.name = option.name;
        input.value = 'true';
        input.checked = option.default === 'true';
        
        input.addEventListener('change', () => {
            updateDependencies();
            checkProfileDrift();
        });

        const label = document.createElement('label');
        label.className = 'form-check-label';
        label.setAttribute('for', `option-${option.name}`);
        label.textContent = option.display_name;
        containerDiv.appendChild(input);
        containerDiv.appendChild(label);
    }

    function renderMultiSelect(option, containerDiv, isAdvanced) {
        containerDiv.innerHTML = `<label class="form-label">${option.display_name}</label>`;
        option.choices.forEach(choice => {
            const formCheck = document.createElement('div');
            formCheck.className = 'form-check';
            
            const input = document.createElement('input');
            input.className = 'form-check-input';
            input.type = 'checkbox';
            input.name = option.name;
            input.value = choice.value;
            input.id = `option-${option.name}-${choice.value}`;
            
            input.addEventListener('change', () => {
                checkProfileDrift();
            });

            const label = document.createElement('label');
            label.className = 'form-check-label';
            label.htmlFor = input.id;
            label.textContent = choice.text;
            
            formCheck.appendChild(input);
            formCheck.appendChild(label);
            containerDiv.appendChild(formCheck);
        });
    }

    async function startProcessing(event) {
        event.preventDefault();
        const generatorType = generatorTypeSelect.value;
        if (!generatorType) {
            updateStatus('Please select a generator type.', 'bg-warning');
            return;
        }

        const formData = new FormData(uploadForm);
        const fileInput = uploadForm.querySelector('[name="file"]');
        
        const dataSourceSelect = document.getElementById('option-data_source');
        const isFileRequired = (generatorType === 'transformer') || (dataSourceSelect && dataSourceSelect.value === 'embedded');

        if (isFileRequired && (!fileInput || !fileInput.files || fileInput.files.length === 0)) {
            updateStatus('Please select a file to process for the chosen options.', 'bg-warning');
            return;
        }
        
        const selectedOptions = {};
        for (const [key, value] of formData.entries()) {
            if (key !== 'file' && key !== 'generator_type' && key !== 'original_filename') {
                if (value) { 
                    if (selectedOptions[key]) {
                        if (!Array.isArray(selectedOptions[key])) {
                            selectedOptions[key] = [selectedOptions[key]];
                        }
                        selectedOptions[key].push(value);
                    } else {
                        selectedOptions[key] = value;
                    }
                }
            }
        }

        const finalFormData = new FormData();
        if (fileInput && fileInput.files[0]) {
            const file = fileInput.files[0];
            finalFormData.append('file', file);
            finalFormData.append('original_filename', file.name);
        }
        finalFormData.append('generator_type', generatorType);
        finalFormData.append('options', JSON.stringify(selectedOptions));
        
        updateStatus('Uploading and starting job...', 'bg-info', 0);
        
        try {
            const response = await fetch('/api/process', {
                method: 'POST',
                body: finalFormData,
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to start job.');
            }
            
            const currentFileInput = uploadForm.querySelector('[name="file"]');
            if (currentFileInput) {
                currentFileInput.value = ''; 
            }

            const data = await response.json();
            pollStatus(data.task_id);
        } catch (error) {
            updateStatus(`Error: ${error.message}`, 'bg-danger');
        }
    }

    function updateStatus(message, bgClass, progress = null) {
        let progressBarHtml = '';
        if (progress !== null) {
            progressBarHtml = `<div class="progress" style="height: 20px;"><div class="progress-bar progress-bar-striped progress-bar-animated ${bgClass}" role="progressbar" style="width: ${progress}%;" aria-valuenow="${progress}"></div></div>`;
        }
        statusContainer.innerHTML = `<div class="alert ${bgClass} text-white">${message}</div>${progressBarHtml}`;
    }
    function showResult(filename) {
        statusContainer.innerHTML += `<div class="card-body bg-dark mt-3 rounded"><h5>Artifact Ready:</h5><p class="text-white-50">${filename}</p><a href="/api/download/${filename}" class="btn btn-success" download>Download Artifact</a></div>`;
    }
    function pollStatus(taskId) {
        if (pollingInterval) clearInterval(pollingInterval);
        let progress = 10;
        updateStatus(`Job submitted (ID: ${taskId.substring(0, 8)}...). Waiting for worker...`, 'bg-info', progress);
        pollingInterval = setInterval(async () => {
            try {
                const response = await fetch(`/api/status/${taskId}`);
                if (!response.ok) throw new Error(`Server returned status: ${response.status}`);
                const data = await response.json();
                switch (data.state) {
                    case 'SUCCESS':
                        clearInterval(pollingInterval);
                        updateStatus('Job Successful!', 'bg-success', 100);
                        showResult(data.result);
                        break;
                    case 'FAILURE':
                        clearInterval(pollingInterval);
                        updateStatus(`Error! ${data.error}`, 'bg-danger', 100);
                        break;
                    case 'ACTIVE':
                        progress = Math.min(progress + 15, 90);
                        updateStatus('Job is running...', 'bg-info', progress);
                        break;
                    case 'PENDING':
                        updateStatus('Job is pending in queue...', 'bg-secondary', progress);
                        break;
                    case 'NOT_FOUND':
                        clearInterval(pollingInterval);
                        updateStatus(`Error! Job ID not found. It may have expired.`, 'bg-danger');
                        break;
                }
            } catch (error) {
                clearInterval(pollingInterval);
                updateStatus(`Error: ${error.message}`, 'bg-danger');
            }
        }, 2500);
    }

    generatorTypeSelect.addEventListener('change', onGeneratorTypeChange);
    uploadForm.addEventListener('submit', startProcessing);
    fetchAndBuildUI();
});
</script>
</body>
</html>
